[project]
name = "adaptive-rate-limiter"
version = "0.1.0"
description = "Adaptive Rate Limiting System for DDoS Mitigation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "redis>=5.0.0",
    "prometheus-client>=0.17.0",
    "pyyaml>=6.0.1",
    "watchdog>=3.0.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "structlog>=23.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
